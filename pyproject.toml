[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-trigger"
version = "0.1.0"
description = "Trigger any command by your voice"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "anekos", email = "anekos@snca.net" }]
keywords = ["pipewire", "pulseaudio", "voice", "audio", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.urls]
Repository = "https://github.com/anekos/voice-trigger"

[project.scripts]
voice-trigger = "voice_trigger.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_trigger"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
